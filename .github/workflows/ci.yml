name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build & Compile
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Cache Foundry build
        uses: actions/cache@v4
        with:
          path: |
            ~/.foundry/cache
            out/
            cache/
          key: foundry-${{ runner.os }}-${{ hashFiles('foundry.toml', 'foundry.lock') }}
          restore-keys: |
            foundry-${{ runner.os }}-

      - name: Build contracts
        run: forge build --sizes

      - name: Check contract sizes
        run: |
          echo "Checking contract sizes are within EVM 24KB limit..."
          forge build --sizes 2>&1 | grep -E "(TajirToken|TajirVestingWallet)" || true

  # ---------------------------------------------------------------------------
  # Job 2: Unit, Fuzz & Invariant Tests
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Cache Foundry build
        uses: actions/cache@v4
        with:
          path: |
            ~/.foundry/cache
            out/
            cache/
          key: foundry-${{ runner.os }}-${{ hashFiles('foundry.toml', 'foundry.lock') }}
          restore-keys: |
            foundry-${{ runner.os }}-

      - name: Run unit tests
        run: forge test --match-path "test/unit/**" -vvv

      - name: Run fuzz tests
        run: forge test --match-path "test/fuzz/**" -vvv

      - name: Run invariant tests
        run: forge test --match-path "test/invariant/**" -vvv
        continue-on-error: true  # graceful until invariant suite is populated

      - name: Generate gas snapshot
        run: forge snapshot --check --tolerance 2
        continue-on-error: true  # informational; does not block CI

  # ---------------------------------------------------------------------------
  # Job 3: Linting & Formatting
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Check Solidity formatting
        run: forge fmt --check

      - name: Install Solhint
        run: npm install -g solhint

      - name: Run Solhint
        run: solhint "src/**/*.sol" "script/**/*.sol" --config .solhint.json

  # ---------------------------------------------------------------------------
  # Job 4: Coverage (runs on main branch pushes only)
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Generate coverage report
        run: |
          forge coverage --report lcov
          genhtml lcov.info --output-directory coverage/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
