[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Solidity compiler settings
solc_version = "0.8.27"
evm_version = "cancun"

# Optimizer settings (required for contract size <24KB)
optimizer = true
optimizer_runs = 200

# Remappings for dependencies
remappings = [
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Testing settings
verbosity = 3
fuzz = { runs = 256 }
invariant = { runs = 1000, depth = 20 }

# Gas reporting
gas_reports = ["*"]

# Coverage settings
via_ir = false

# File system permissions for Config contract (read/write deployments.toml)
fs_permissions = [
    { access = "read-write", path = "./" }
]

# Formatting
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "all"
quote_style = "double"
number_underscore = "thousands"

# Profiles for different networks
[profile.tajir_testnet]
eth_rpc_url = "${TAJIR_TESTNET_RPC_URL}"

[profile.sepolia]
eth_rpc_url = "${SEPOLIA_RPC_URL}"

[profile.mainnet]
eth_rpc_url = "${MAINNET_RPC_URL}"

[profile.local]
eth_rpc_url = "http://localhost:8545"

# RPC endpoints configuration
[rpc_endpoints]
tajir_testnet = "${TAJIR_TESTNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"
local = "http://localhost:8545"

# Etherscan API configuration
[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
mainnet = { key = "${ETHERSCAN_API_KEY}" }

# CI Profile - stricter settings for continuous integration
[profile.ci]
verbosity = 4
fuzz = { runs = 1000 }
invariant = { runs = 512, depth = 20 }
gas_reports = ["*"]
via_ir = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
